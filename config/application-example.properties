# ============================================
# SAFE EXAMPLE CONFIGURATION (NO REAL SECRETS)
# Copy to config/application.properties and set real values.
# ============================================

# ============================================
# DATABASE
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/SERVI
spring.datasource.username=postgres
spring.datasource.password=YOUR_PASSWORD

# ============================================
# JWT
# ============================================
jwt.secret=YOUR_SECRET_MIN_32_CHARS
jwt.expiration=36000000

# ============================================
# CORS
# ============================================
app.cors.allowed-origin-patterns=http://localhost:5173,http://192.168.1.*:5173

# ============================================
# JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# FILE UPLOAD
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# LOGGING
# ============================================
logging.level.org.springframework.boot.web.embedded.tomcat=DEBUG
logging.level.org.springframework.web=DEBUG
spring.devtools.restart.enabled=false